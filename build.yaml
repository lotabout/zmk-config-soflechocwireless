# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: nice_nano_v2
    shield: sofle_left
  - board: nice_nano_v2
    shield: sofle_right
  # 调试用：左半边带 USB 日志，排查 OLED 不亮
  - board: nice_nano_v2
    shield: sofle_left
    snippet: zmk-usb-logging
    artifact-name: sofle_left-usb-logging
    # 推迟日志输出 8 秒并加大缓冲，以便抓到开机时的显示初始化日志
    cmake-args: -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000 -DCONFIG_LOG_BUFFER_SIZE=32768
